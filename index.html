  const form = root.querySelector(".form");
  const queryInput = root.querySelector("#pdm-query");
  const output = root.querySelector(".output");

  function normalizeText(value) {
    return String(value || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9ñ\s]/gi, " ").replace(/\s+/g, " ").trim();
  }
  function normalizeDoc(value) { return String(value || "").replace(/\D/g, ""); }
  function isLikelyDocument(value) { return normalizeDoc(value).length >= 5 && normalizeDoc(value).length >= String(value).replace(/\s/g, "").length * .75; }
  function hasValidEmail(person) { return !!person.email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(person.email.trim()); }
  function clearOutput() { output.replaceChildren(); }
  function scrollToOutput(el) { try { el.scrollIntoView({behavior:"smooth",block:"nearest"}); } catch(e) { el.scrollIntoView(); } }
  function addRectify(actions) {
    const a=document.createElement("a"); a.className="linkbtn rectify"; a.href=RECTIFY_URL; a.target="_blank"; a.rel="noopener noreferrer"; a.textContent="Rectificar datos"; actions.appendChild(a);
  }
  function field(label, value) {
    const d=document.createElement("div"); d.className="field"; const s=document.createElement("small"); s.textContent=label; const v=document.createElement("div"); v.textContent=value || "No registrado"; d.append(s,v); return d;
  }
  function renderNotFound(query) {
    clearOutput(); const card=document.createElement("article"); card.className="notfound";
    const h=document.createElement("h3"); h.textContent="No se encontró un registro asociado a la consulta";
    const p=document.createElement("p"); p.textContent="Revise que el número de documento o el nombre estén escritos correctamente. Si considera que existe un error en sus datos, puede solicitar la rectificación en el formulario indicado.";
    const q=document.createElement("p"); const b=document.createElement("strong"); b.textContent="Dato consultado: "; q.append(b,document.createTextNode(query));
    const actions=document.createElement("div"); actions.className="actions"; addRectify(actions);
    card.append(h,p,q,actions); output.append(card); scrollToOutput(card);
  }
  function renderMatches(matches) {
    clearOutput(); const card=document.createElement("article"); card.className="matches";
    const h=document.createElement("h3"); h.textContent="Se encontraron varias coincidencias";
    const p=document.createElement("p"); p.textContent="Seleccione el registro correspondiente para ver el resultado de certificación y verificar sus datos.";
    const list=document.createElement("div"); list.className="match-list";
    matches.slice(0,25).forEach(person=>{
      const item=document.createElement("div"); item.className="match-item"; const info=document.createElement("div"); const b=document.createElement("b"); b.textContent=person.name; const sm=document.createElement("small"); sm.textContent="Documento terminado en " + person.doc.slice(-4) + " · " + (person.certifiable ? "Certificable" : "No cumple"); info.append(b,sm); const btn=document.createElement("button"); btn.type="button"; btn.className="secondary"; btn.textContent="Ver resultado"; btn.addEventListener("click",()=>renderResult(person)); item.append(info,btn); list.append(item);
    });
    card.append(h,p,list); output.append(card); scrollToOutput(card);
  }
  function renderResult(person) {
    clearOutput(); const card=document.createElement("article"); card.className="result";
    const status=document.createElement("div"); status.className="status " + (person.certifiable ? "ok" : "bad"); status.textContent=person.certifiable ? "Certificable" : "No cumple con los criterios de certificación";
    const grid=document.createElement("div"); grid.className="grid";
    grid.append(field("Nombre", person.name), field("Cédula", person.doc), field("Correo electrónico", person.email || "No registrado"), field("Asistencia", person.attendance + " de 24 sesiones · " + person.percentLabel));
    const summary=document.createElement("p"); summary.className="summary";
    if (!person.certifiable) {
      summary.textContent = "La persona consultada no cumple con los criterios de certificación. Verifique cuidadosamente que su nombre, cédula y correo electrónico estén correctos.";
    }
    const warning=document.createElement("div"); warning.className="warning";
    warning.textContent = hasValidEmail(person) ? "Si su nombre, cédula o correo presentan errores de digitación, debe solicitar la rectificación de datos en el enlace dispuesto para este proceso." : "Este registro no tiene correo electrónico válido o no registra correo. Debe solicitar la rectificación de datos en el enlace dispuesto para este proceso.";
    const actions=document.createElement("div"); actions.className="actions"; addRectify(actions);
    const again=document.createElement("button"); again.type="button"; again.className="secondary"; again.textContent="Nueva consulta"; again.addEventListener("click",()=>{ queryInput.value=""; clearOutput(); queryInput.focus(); }); actions.append(again);
    card.append(status,grid);
    if (summary.textContent) card.append(summary);
    card.append(warning,actions); output.append(card); scrollToOutput(card);
  }
  function search(value) {
    const raw=String(value||"").trim(); if(!raw) return [];
    if(isLikelyDocument(raw)) { const doc=normalizeDoc(raw); return DATA.filter(p=>p.doc===doc); }
    const txt=normalizeText(raw); return DATA.filter(p=>normalizeText(p.name).includes(txt));
  }
  form.addEventListener("submit", function(e) {
    e.preventDefault(); const q=queryInput.value.trim(); if(!q) { queryInput.focus(); return; }
    const matches=search(q); if(!matches.length) return renderNotFound(q); if(matches.length===1 || isLikelyDocument(q)) return renderResult(matches[0]); return renderMatches(matches);
  });
